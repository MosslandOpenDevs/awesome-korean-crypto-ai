name: health

# Weekly link/URL health check across every url, terms_url, and evidence_url in the catalog.
# Gated 401/403/405/429 responses count as alive (many KR gov/exchange sites block bots).
# Only 404/410 fail the job (--fail-on-dead); 5xx/timeouts/DNS blips are retried and, if still
# failing, reported as UNREACHABLE warnings rather than hard failures. A curator triages per
# MAINTAINERS.md (repeated failures -> status: watch -> archive candidate).

on:
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Check links
        run: python scripts/check_links.py --fail-on-dead
