name: quality

# Validates the catalog data and fails if the generated files (README*, catalog.json)
# are out of date. Runs on every PR and push to main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate catalog data (schema + referential + semantic)
        run: python scripts/validate.py --strict

      - name: Check generated files are up to date
        run: python scripts/build.py --check
