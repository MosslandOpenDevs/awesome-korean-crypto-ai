id: kosis-openapi
name: KOSIS Open API
url: https://kosis.kr/openapi/
category: macro-data
publisher: National Data Administration (국가데이터처)
publisher_relation: government
description: Korea's national statistics portal (KOSIS) open API — demographics, prices, employment, industrial
  production. Now operated by the National Data Administration (국가데이터처), which replaced Statistics Korea
  (통계청) on 2025-10-01. Requires SSO login and a free key.
description_ko: 국가통계포털(KOSIS) 공개 API — 인구·물가·고용·산업생산. 2025-10-01 통계청을 대체한 국가데이터처가 운영. SSO 로그인과 무료 인증키
  필요.
korea_relevance: Official Korean socio-economic statistics.
ai_utility: Structured statistical series for grounding agents.
interfaces:
- rest
- json
capabilities:
- public-read
risk_class: R0
auth: registration
cost: free
status: active
status_reason: 2026 API changes — HTTP endpoint sunset (HTTPS-only) and per-minute call limits (~1,000/min),
  announced 2026-02-05 and revised 2026-07-09.
status_reason_ko: 2026년 API 변경 — HTTP 엔드포인트 종료(HTTPS 전용) 및 분당 호출 제한(~1,000회/분), 2026-02-05 공지·2026-07-09
  개정.
last_verified_at: '2026-07-14'
