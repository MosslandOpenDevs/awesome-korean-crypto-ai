description: Official API for Bithumb, a major Korean KRW exchange. Public API (ticker, orderbook, candles)
  needs no auth; private API (JWT) adds balances, orders, and withdrawal. Ships an llms.txt for agent
  tooling.
description_ko: 주요 KRW 거래소 빗썸의 공식 API. 공개 API(시세·오더북·캔들)는 인증 불필요, 프라이빗 API(JWT)는 잔고·주문·출금 제공. 에이전트용 llms.txt
  제공.
korea_relevance: Second-largest KRW exchange; core Korean market data.
ai_utility: Auth-free public endpoints plus an llms.txt; private endpoints reach R3 once keyed.
